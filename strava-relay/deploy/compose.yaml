name: health-bridge-strava
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_HOST: "${RELAY_HOST:?Set RELAY_HOST in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
  relay:
    build:
      context: ..
    restart: unless-stopped
    init: true
    depends_on:
      - proxy
    network_mode: service:proxy
    environment:
      PUBLIC_BASE_URL: "https://${RELAY_HOST:?Set RELAY_HOST in .env}"
      STRAVA_CLIENT_ID: "${STRAVA_CLIENT_ID:?Set STRAVA_CLIENT_ID in .env}"
      STRAVA_CLIENT_SECRET: "${STRAVA_CLIENT_SECRET:?Set STRAVA_CLIENT_SECRET in .env}"
      PORT: "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/config',{headers:{'X-Real-IP':'127.0.0.1'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  caddy_data:
  caddy_config:
